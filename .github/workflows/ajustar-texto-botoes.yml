name: Ajustar texto dos botoes

on:
  push:
    paths:
      - '.github/workflows/ajustar-texto-botoes.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar cor das letras
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('color:#fff;box-shadow:0 10px 28px rgba(61,23,111,.30);border:0}.btn-primary:hover', 'color:#391466;box-shadow:0 10px 28px rgba(61,23,111,.30);border:0}.btn-primary:hover')
          s = s.replace('transform:translateY(-2px);box-shadow:0 14px 32px rgba(61,23,111,.36)}', 'color:#391466;transform:translateY(-2px);box-shadow:0 14px 32px rgba(61,23,111,.36)}')
          s = s.replace('color:#4b168f;box-shadow:0 10px 26px', 'color:#391466;box-shadow:0 10px 26px')
          s = s.replace('color:#4b168f;transform:translateY(-2px);box-shadow:0 14px 30px', 'color:#391466;transform:translateY(-2px);box-shadow:0 14px 30px')
          s = s.replace('.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 21px;border-radius:10px;font-weight:800;border:0;', '.btn{display:inline-flex;align-items:center;justify-content:center;gap:9px;padding:13px 21px;border-radius:10px;font-weight:800;color:#391466;border:0;')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commitar e remover workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/ajustar-texto-botoes.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Define letras dos botoes em roxo forte'
          git push
