name: Ajustar nome da instituição

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar-nome:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Padronizar UniÚnica no index.html
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('Centro Universitário ÚNICA', 'Centro Universitário UniÚnica')
          s = s.replace('Centro Universitário Única', 'Centro Universitário UniÚnica')
          s = s.replace('Centro Universitário única', 'Centro Universitário uniúnica')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Salvar alteração
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração necessária.'
          else
            git commit -m 'Padroniza nome da instituição para UniÚnica'
            git push
          fi
