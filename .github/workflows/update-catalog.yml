name: Atualizar catalogo de graduacao
on:
  push:
    paths:
      - 'catalogo-trigger.txt'
permissions:
  contents: write
jobs:
  update:
    if: ${{ hashFiles('catalogo-trigger.txt') != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Atualizar catalogo
        run: |
          python scripts/update_catalog.py
          rm -f catalogo-trigger.txt
      - name: Commitar alteracoes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html catalogo-trigger.txt
          git diff --cached --quiet || git commit -m 'Adiciona catalogo de graduacao por modalidade'
          git push
