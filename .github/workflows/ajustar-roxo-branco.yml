name: Ajustar roxo com letras brancas

on:
  push:
    paths:
      - '.github/workflows/ajustar-roxo-branco.yml'

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corrigir cores
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          s=s.replace('background:linear-gradient(135deg,#3d176f 0%,#6526b8 55%,#7b2fd0 100%);color:#391466;', 'background:linear-gradient(135deg,#3d176f 0%,#6526b8 55%,#7b2fd0 100%);color:#fff;')
          s=s.replace('background:linear-gradient(135deg,#32105c 0%,#54209c 55%,#6f28bd 100%);color:#391466;', 'background:linear-gradient(135deg,#32105c 0%,#54209c 55%,#6f28bd 100%);color:#fff;')
          s=s.replace('.btn-primary:hover{', '.btn-primary:hover{')
          p.write_text(s,encoding='utf-8')
          PY
      - name: Commitar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/ajustar-roxo-branco.yml
          git commit -m 'Mantem letras brancas nas caixas roxas' || exit 0
          git push
