name: Finalizar cores UniÚnica

on:
  push:
    paths:
      - '.github/workflows/finalizar-cores.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Garantir cores finais
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          css = '''
          /* IDENTIDADE FINAL UNIÚNICA */
          .btn-primary,
          .btn-primary:hover { color:#fff !important; }
          .btn-accent,
          .btn-accent:hover { color:#391466 !important; }
          .btn-outline,
          .btn-outline:hover { color:#391466 !important; }
          .floating-wa svg { stroke:#25D366 !important; color:#25D366 !important; }
          .floating-wa svg * { stroke:#25D366 !important; }
          '''
          if '/* IDENTIDADE FINAL UNIÚNICA */' not in s:
              s = s.replace('</style>', css + '\n</style>', 1)
          p.write_text(s, encoding='utf-8')
      - name: Publicar alteração
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/finalizar-cores.yml
          git commit -m 'Finaliza cores dos botoes e WhatsApp' || exit 0
          git push
