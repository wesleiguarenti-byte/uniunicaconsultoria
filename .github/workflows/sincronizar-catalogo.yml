name: Sincronizar catálogo oficial

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  sincronizar:
    if: "!contains(github.event.head_commit.message, '[catalogo-auto]')"
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v4

      - name: Ativar catálogo oficial
        shell: python
        run: |
          from pathlib import Path
          p = Path('index.html')
          html = p.read_text(encoding='utf-8')
          tag = '<script src="catalogo-oficial.js"></script>'
          if tag not in html:
              html = html.replace('</body>', f'{tag}\n</body>', 1)
              p.write_text(html, encoding='utf-8')
              print('Catálogo oficial conectado ao site.')
          else:
              print('Catálogo oficial já está conectado.')

      - name: Publicar alteração
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Conecta catálogo oficial de cursos [catalogo-auto]"
          git push
